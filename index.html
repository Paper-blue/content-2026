<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zayen 每日新闻 · 2026</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f2f3f7;
            background-image: linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 28px 28px;
            color: #3a3f4a;
            line-height: 1.7;
            padding: 40px 20px;
        }
        .container { max-width: 680px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 40px; padding: 28px 20px; }
        .badge {
            display: inline-block; font-size: 11px; color: #3a7abf;
            letter-spacing: 3px; font-weight: 600;
            padding: 3px 14px; border: 1px solid #c0d5ea;
            border-radius: 20px; background: #edf2f8; margin-bottom: 10px;
        }
        h1 { font-size: 28px; color: #1a1e28; font-weight: 600; margin-bottom: 8px; }
        .subtitle { font-size: 14px; color: #9aa0ae; }
        
        .latest-card {
            background: #fff; border-radius: 12px;
            border: 1px solid #e0e3ea; border-top: 4px solid #3a7abf;
            padding: 24px; margin-bottom: 32px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .latest-card h2 {
            font-size: 16px; color: #3a7abf; margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
        }
        .latest-card h2::before { content: "●"; font-size: 10px; }
        .latest-link {
            display: block; text-decoration: none; color: #1a1e28;
            font-size: 18px; font-weight: 600; padding: 16px;
            background: #f8f9fc; border-radius: 8px;
            border-left: 3px solid #3a7abf; transition: all 0.2s;
        }
        .latest-link:hover { background: #edf2f8; transform: translateX(4px); }
        .latest-link .date { font-size: 12px; color: #9aa0ae; font-weight: 400; margin-top: 4px; }
        
        .archive-section h2 {
            font-size: 16px; color: #1a1e28; margin-bottom: 16px;
            padding-left: 12px; border-left: 3px solid #c8d5e5;
        }
        .month-group { margin-bottom: 24px; }
        .month-label {
            font-size: 14px; font-weight: 600; color: #3a7abf;
            margin-bottom: 12px; padding: 6px 12px;
            background: #edf2f8; border-radius: 6px; display: inline-block;
        }
        .day-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .day-link {
            display: inline-block; padding: 8px 14px; background: #fff;
            border: 1px solid #e0e3ea; border-radius: 6px;
            text-decoration: none; color: #4a5060; font-size: 13px;
            transition: all 0.15s;
        }
        .day-link:hover { background: #3a7abf; color: #fff; border-color: #3a7abf; }
        .day-link .d { font-weight: 600; }
        
        footer {
            text-align: center; margin-top: 48px; padding-top: 24px;
            border-top: 1px solid #e0e3ea; font-size: 12px; color: #9aa0ae;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="badge">AI DAILY 2026</div>
            <h1>Zayen 每日新闻</h1>
            <p class="subtitle">构建者视角 · AI 行业日报</p>
        </header>
        
        <div class="latest-card">
            <h2>最新日报</h2>
            <a href="daily/2026-05-08/" class="latest-link">
                AI 行业日报 · 05月08日
                <div class="date">2026-05-08 · 精选 10 条</div>
            </a>
        </div>
        
        <div class="archive-section">
            <h2>历史归档</h2>
            
            <div class="month-group">
                <div class="month-label">五月</div>
                <div class="day-list">
                    <a href="daily/2026-05-08/" class="day-link"><span class="d">05/08</span> 周五</a>
                </div>
            </div>
        </div>
        
        <footer>
            <p>由 Zayen知览 整理 · GitHub Pages 托管</p>
        </footer>
    </div>
</body>
</html>
