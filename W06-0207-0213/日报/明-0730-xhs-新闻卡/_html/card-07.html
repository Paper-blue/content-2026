<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 1080px;
  background: #0a0e27;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', sans-serif;
}

.canvas {
  width: 1080px;
  min-height: 1440px;
  position: relative;
  background: linear-gradient(145deg, #0a0e27 0%, #0f1635 20%, #141e45 40%, #0d2847 60%, #0a2a3a 80%, #0e1a2e 100%);
}

.blob { position: absolute; border-radius: 50%; filter: blur(120px); }
.blob-1 { width: 600px; height: 600px; background: radial-gradient(circle, rgba(56,132,244,0.4) 0%, transparent 70%); top: -100px; left: -100px; }
.blob-2 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(138,79,255,0.35) 0%, transparent 70%); top: 300px; right: -150px; }
.blob-3 { width: 450px; height: 450px; background: radial-gradient(circle, rgba(0,200,200,0.3) 0%, transparent 70%); bottom: 100px; left: 100px; }
.blob-4 { width: 350px; height: 350px; background: radial-gradient(circle, rgba(200,100,255,0.2) 0%, transparent 70%); bottom: -50px; right: 100px; }

.ghost-number {
  position: absolute;
  top: 40px; right: 40px;
  font-size: 300px;
  font-weight: 800;
  color: rgba(255, 255, 255, 0.06);
  line-height: 1;
  z-index: 5;
  letter-spacing: -10px;
}

.content {
  position: relative;
  display: flex;
  flex-direction: column;
  padding: 56px 48px 48px 48px;
  z-index: 10;
  min-height: 1440px;
}

.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 28px;
}
.top-label {
  display: inline-flex;
  align-items: center;
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 100px;
  padding: 10px 24px;
  font-size: 24px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.5);
  letter-spacing: 2px;
}
.top-watermark {
  font-family: 'PingFang SC', 'Helvetica Neue', sans-serif;
  font-size: 26px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.28);
  letter-spacing: 2px;
}
.top-date {
  font-size: 24px;
  color: rgba(255, 255, 255, 0.3);
  letter-spacing: 1px;
}

.news-card {
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(16px) saturate(130%);
  -webkit-backdrop-filter: blur(16px) saturate(130%);
  border-radius: 28px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  padding: 44px 44px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.08), inset 0 -1px 0 rgba(255,255,255,0.02);
  display: flex;
  flex-direction: column;
}

.meta-row {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 20px;
}
.news-number {
  font-size: 60px;
  font-weight: 700;
  background: linear-gradient(135deg, #38b4ff, #8a4fff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
}
.category-badge {
  display: inline-block;
  background: rgba(56, 180, 255, 0.15);
  border: 1px solid rgba(56, 180, 255, 0.25);
  border-radius: 8px;
  padding: 8px 18px;
  font-size: 24px;
  font-weight: 500;
  color: rgba(56, 180, 255, 0.9);
}
.heat-badge { font-size: 24px; }

.news-title {
  font-size: 54px;
  font-weight: 700;
  color: #fff;
  line-height: 1.35;
  margin-bottom: 10px;
}
.news-source {
  font-size: 24px;
  color: rgba(255, 255, 255, 0.3);
  margin-bottom: 24px;
  letter-spacing: 1px;
}

.news-image {
  max-width: 100%;
  height: auto;
  border-radius: 16px;
  margin-bottom: 20px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  display: block;
}

.facts {
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin-bottom: 20px;
}
.fact {
  position: relative;
  padding-left: 20px;
  font-size: 32px;
  font-weight: 400;
  color: rgba(255, 255, 255, 0.75);
  line-height: 1.65;
}
.fact::before {
  content: '';
  position: absolute;
  left: 0; top: 8px; bottom: 8px;
  width: 3px;
  background: linear-gradient(180deg, rgba(56,180,255,0.6), rgba(56,180,255,0.1));
  border-radius: 2px;
}
.fact strong { color: #fff; font-weight: 600; }

.comment-card {
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: 16px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  padding: 24px 28px;
}
.comment-label {
  display: inline-block;
  font-size: 22px;
  font-weight: 600;
  color: rgba(255, 107, 53, 0.9);
  margin-bottom: 10px;
  letter-spacing: 2px;
}
.comment-text {
  font-size: 28px;
  font-weight: 400;
  color: rgba(255, 255, 255, 0.6);
  line-height: 1.65;
}
.comment-text strong {
  color: rgba(255, 180, 100, 0.9);
  font-weight: 600;
}
</style>
</head>
<body>
<div class="canvas">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>
  <div class="ghost-number">07</div>

  <div class="content">
    <div class="top-bar">
      <div class="top-label">AI DAILY</div>
      <div class="top-watermark">@Zayen知蓝</div>
      <div class="top-date">02.10 · 7/8</div>
    </div>

    <div class="news-card">
      <div class="meta-row">
        <div class="news-number">07</div>
        <div class="category-badge">行业动态</div>
        <div class="heat-badge">📌</div>
      </div>

      <div class="news-title">边缘AI芯片第一股来了 市值166亿</div>
      <div class="news-source">36氪 · 2026-02-10</div>

      <div class="facts">
        <div class="fact"><strong>爱芯元智</strong> 在香港交易所主板挂牌上市，开盘报 <strong>28.2港元</strong>，总市值 <strong>166亿港元</strong>，成为首家在港股上市的边缘计算AI芯片企业。</div>
        <div class="fact">公司已商业化多代 <strong>SoC</strong> 产品，覆盖数十种型号，截至2025年9月累计出货 <strong>1.65亿颗</strong>。</div>
      </div>

      <img class="news-image" src="/Users/paperblue/Projects/Obsidian/ContentCreation/内容创作/2026/02/10-AI行业日报/附件/07-axera-ai-chip.jpg" alt="" />

      <div class="comment-card">
        <div class="comment-label">💡 INSIGHT</div>
        <div class="comment-text"><strong>边缘计算芯片</strong> 商业化难度在于场景碎片化——智能驾驶、工业视觉、AIoT各有不同算力-功耗-成本平衡。1.65亿颗出货说明已在多个垂直场景找到 <strong>产品-市场契合度</strong>。</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
