<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'HarmonyOS Sans SC'; src: url('/Users/paperblue/Library/Fonts/HarmonyOS_Sans_SC_Regular.ttf'); font-weight: 400; }
@font-face { font-family: 'HarmonyOS Sans SC'; src: url('/Users/paperblue/Library/Fonts/HarmonyOS_Sans_SC_Medium.ttf'); font-weight: 500; }
@font-face { font-family: 'HarmonyOS Sans SC'; src: url('/Users/paperblue/Library/Fonts/HarmonyOS_Sans_SC_Bold.ttf'); font-weight: 700; }
@font-face { font-family: 'HarmonyOS Sans SC'; src: url('/Users/paperblue/Library/Fonts/HarmonyOS_Sans_SC_Black.ttf'); font-weight: 900; }

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 1080px;
  height: 1440px;
  overflow: hidden;
  background: #0a0e27;
  font-family: 'HarmonyOS Sans SC', sans-serif;
}

.canvas {
  width: 1080px;
  height: 1440px;
  position: relative;
  background: linear-gradient(145deg, #0a0e27 0%, #0f1635 20%, #141e45 40%, #0d2847 60%, #0a2a3a 80%, #0e1a2e 100%);
  overflow: hidden;
}

.blob { position: absolute; border-radius: 50%; filter: blur(120px); }
.blob-1 { width: 600px; height: 600px; background: radial-gradient(circle, rgba(56,132,244,0.4) 0%, transparent 70%); top: -100px; left: -100px; }
.blob-2 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(138,79,255,0.35) 0%, transparent 70%); top: 300px; right: -150px; }
.blob-3 { width: 450px; height: 450px; background: radial-gradient(circle, rgba(0,200,200,0.3) 0%, transparent 70%); bottom: 100px; left: 100px; }
.blob-4 { width: 350px; height: 350px; background: radial-gradient(circle, rgba(200,100,255,0.2) 0%, transparent 70%); bottom: -50px; right: 100px; }

.glass-orb { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.06); }
.orb-1 { width: 200px; height: 200px; top: 120px; right: 60px; }
.orb-2 { width: 120px; height: 120px; bottom: 200px; left: 60px; }
.orb-3 { width: 80px; height: 80px; top: 500px; left: 180px; }

.ghost-text {
  position: absolute;
  top: 80px; right: 40px;
  font-size: 320px;
  font-weight: 800;
  color: rgba(255, 255, 255, 0.04);
  line-height: 1;
  z-index: 5;
  letter-spacing: -10px;
}

.content {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 100px 80px;
  z-index: 10;
  text-align: center;
}

.name {
  font-size: 128px;
  font-weight: 900;
  color: #fff;
  letter-spacing: 6px;
  line-height: 1.2;
  margin-bottom: 36px;
  text-shadow: 0 0 80px rgba(56,180,255,0.3), 0 0 160px rgba(138,79,255,0.15);
}

.role {
  display: inline-block;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 100px;
  padding: 18px 48px;
  font-size: 36px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.65);
  letter-spacing: 4px;
  margin-bottom: 80px;
}

.divider {
  width: 80px; height: 3px;
  background: linear-gradient(90deg, rgba(56,180,255,0.8), rgba(138,79,255,0.6));
  border-radius: 2px;
  margin: 0 auto 72px auto;
}

.hook {
  font-size: 54px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.85);
  line-height: 1.6;
  letter-spacing: 2px;
}
.hook em {
  font-style: normal;
  background: linear-gradient(90deg, #38b4ff, #8a4fff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 600;
}

.sub {
  font-size: 30px;
  font-weight: 400;
  color: rgba(255, 255, 255, 0.25);
  letter-spacing: 2px;
  margin-top: 60px;
}
</style>
</head>
<body>
<div class="canvas">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>
  <div class="glass-orb orb-1"></div>
  <div class="glass-orb orb-2"></div>
  <div class="glass-orb orb-3"></div>
  <div class="ghost-text">Hi</div>

  <div class="content">
    <div class="name">Zayen知蓝</div>
    <div class="role">BUILD IN PUBLIC</div>
    <div class="divider"></div>
    <div class="hook">一个 AI Builder 的<em>公开日记</em><br>边做边聊，边学边分享</div>
    <div class="sub">左滑了解更多 →</div>
  </div>
</div>
</body>
</html>
