<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'HarmonyOS Sans SC'; src: url('/Users/paperblue/Library/Fonts/HarmonyOS_Sans_SC_Regular.ttf'); font-weight: 400; }
@font-face { font-family: 'HarmonyOS Sans SC'; src: url('/Users/paperblue/Library/Fonts/HarmonyOS_Sans_SC_Medium.ttf'); font-weight: 500; }
@font-face { font-family: 'HarmonyOS Sans SC'; src: url('/Users/paperblue/Library/Fonts/HarmonyOS_Sans_SC_Bold.ttf'); font-weight: 700; }
@font-face { font-family: 'HarmonyOS Sans SC'; src: url('/Users/paperblue/Library/Fonts/HarmonyOS_Sans_SC_Black.ttf'); font-weight: 900; }

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 1080px;
  height: 1440px;
  overflow: hidden;
  background: #0a0e27;
  font-family: 'HarmonyOS Sans SC', sans-serif;
}

.canvas {
  width: 1080px;
  height: 1440px;
  position: relative;
  background: linear-gradient(145deg, #0a0e27 0%, #0f1635 20%, #141e45 40%, #0d2847 60%, #0a2a3a 80%, #0e1a2e 100%);
  overflow: hidden;
}

.blob { position: absolute; border-radius: 50%; filter: blur(120px); }
.blob-1 { width: 600px; height: 600px; background: radial-gradient(circle, rgba(56,132,244,0.4) 0%, transparent 70%); top: -100px; left: -100px; }
.blob-2 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(138,79,255,0.35) 0%, transparent 70%); top: 300px; right: -150px; }
.blob-3 { width: 450px; height: 450px; background: radial-gradient(circle, rgba(0,200,200,0.3) 0%, transparent 70%); bottom: 100px; left: 100px; }
.blob-4 { width: 350px; height: 350px; background: radial-gradient(circle, rgba(200,100,255,0.2) 0%, transparent 70%); bottom: -50px; right: 100px; }

.ghost-text {
  position: absolute;
  top: 50px; right: -30px;
  font-size: 200px;
  font-weight: 800;
  color: rgba(255, 255, 255, 0.04);
  line-height: 1;
  z-index: 5;
  letter-spacing: -5px;
}

.content {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  padding: 56px 48px 48px 48px;
  z-index: 10;
}

.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 40px;
}
.top-label {
  display: inline-flex;
  align-items: center;
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 100px;
  padding: 10px 24px;
  font-size: 24px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.5);
  letter-spacing: 2px;
}
.top-watermark {
  font-family: 'PingFang SC', 'Helvetica Neue', sans-serif;
  font-size: 26px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.28);
  letter-spacing: 2px;
}
.top-page {
  font-size: 24px;
  color: rgba(255, 255, 255, 0.3);
  letter-spacing: 1px;
}

.glass-card {
  flex: 1;
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(16px) saturate(130%);
  -webkit-backdrop-filter: blur(16px) saturate(130%);
  border-radius: 28px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  padding: 64px 52px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.08);
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
}

.section-label {
  display: inline-block;
  font-size: 26px;
  font-weight: 600;
  color: rgba(56, 180, 255, 0.9);
  letter-spacing: 4px;
  margin-bottom: 40px;
}

.section-title {
  font-size: 56px;
  font-weight: 700;
  color: #fff;
  line-height: 1.4;
  margin-bottom: 56px;
}

.section-body {
  font-size: 34px;
  font-weight: 400;
  color: rgba(255, 255, 255, 0.6);
  line-height: 1.85;
  margin-bottom: auto;
}

.highlight-box {
  background: rgba(255, 255, 255, 0.04);
  border-left: 3px solid;
  border-image: linear-gradient(180deg, rgba(56,180,255,0.6), rgba(138,79,255,0.4)) 1;
  border-radius: 0 12px 12px 0;
  padding: 32px 36px;
  margin-top: 56px;
}

.highlight-text {
  font-size: 34px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.7);
  line-height: 1.7;
  font-style: italic;
}
</style>
</head>
<body>
<div class="canvas">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>
  <div class="ghost-text">WHY</div>

  <div class="content">
    <div class="top-bar">
      <div class="top-label">ABOUT</div>
      <div class="top-watermark">@Zayen知蓝</div>
      <div class="top-page">1/3</div>
    </div>

    <div class="glass-card">
      <div class="section-label">🛠️ WHY BUILD IN PUBLIC</div>
      <div class="section-title">为什么开这个号</div>

      <div class="section-body">做 AI 相关的事，每天都在看大量信息、踩坑、试新工具。<br><br>与其自己默默消化，不如把过程摊开来——看到什么、在做什么、学到什么，都公开聊。<br><br>不是专家授课，就是一个 Builder 的工作日志。</div>

      <div class="highlight-box">
        <div class="highlight-text">Build in Public 的核心：<br>过程比结论有价值，真实比完美有意义。</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
