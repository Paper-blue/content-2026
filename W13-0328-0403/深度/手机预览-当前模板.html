<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>当前模板手机预览 · md-to-wechat.py 实际输出</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", sans-serif;
    background: #888;
    padding: 30px 20px;
    min-height: 100vh;
  }
  .label {
    text-align: center;
    font-family: "Courier New", monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: #ddd;
    margin-bottom: 20px;
    text-transform: uppercase;
  }
  .meta {
    text-align: center;
    font-size: 11px;
    color: #bbb;
    margin-bottom: 24px;
    line-height: 1.6;
  }
  .phone-frame {
    width: 390px;
    margin: 0 auto;
    border-radius: 40px;
    overflow: hidden;
    border: 8px solid #1a1a1a;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    background: #1a1a1a;
  }
  .phone-notch {
    height: 34px;
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .phone-notch span {
    width: 80px;
    height: 24px;
    background: #1a1a1a;
    border-radius: 12px;
  }
  .phone-body {
    height: 760px;
    overflow: hidden;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
</style>
</head>
<body>
  <div class="label">— 当前模板实际输出 · md-to-wechat.py —</div>
  <div class="meta">
    article.md → wechat-公众号版.html（default 主题 / 说透 Nothing 风格）<br>
    W13 · AI裁员再回聘 · 字数 1818
  </div>
  <div class="phone-frame">
    <div class="phone-notch"><span></span></div>
    <div class="phone-body">
      <iframe src="./AI裁员再回聘/wechat-公众号版.html"></iframe>
    </div>
  </div>
</body>
</html>
